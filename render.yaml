# Render Blueprint – https://render.com/docs/blueprint-spec
# New → Blueprint → select this repository. Render creates the database and
# web service below, then asks for the values marked `sync: false`.
databases:
  - name: campus-connect-db
    plan: free
    databaseName: campus_connect
    user: campus_connect

services:
  - type: web
    name: campus-connect-api
    runtime: python
    # A persistent disk (for uploaded images) needs a paid instance type.
    plan: starter
    rootDir: backend
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60
    healthCheckPath: /api/health/
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: campus-connect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SERVE_MEDIA
        value: "True"
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # e.g. https://campus-connect.vercel.app
      - key: FRONTEND_URL
        sync: false        # same Vercel URL, used in password-reset emails
      - key: ALLOWED_HOSTS
        value: localhost   # Render adds its own hostname automatically
